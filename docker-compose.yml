services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meme
      # Required: copy .env.example to .env and set POSTGRES_PASSWORD before
      # the first start. There is deliberately no weak fallback.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}"
      POSTGRES_DB: meme_battle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meme -d meme_battle"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    image: ${APP_IMAGE:-meme-battle-app:local}
    build: .
    restart: unless-stopped
    ports:
      # 0.0.0.0 is required for phones on the LAN; use 127.0.0.1 for local-only.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      # Compose builds the connection string from the required password above.
      DATABASE_URL: "postgresql://meme:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/meme_battle?schema=public"
      PORT: "3000"
      UPLOAD_DIR: /data/uploads
      # Overridable via a local .env file or shell environment (compose
      # substitutes ${ADMIN_EMAIL} / ${ADMIN_PASSWORD}).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      # Empty/unset: a random password is generated on first boot and logged.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Empty = auto-detect (X-Forwarded-Proto / request URL); pin true/false
      # to force the admin session cookie's Secure flag.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Comma-separated allowed Socket.io origins; empty = same-origin only.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Optional Imgflip API key (premium): enables full-catalog search in the
      # admin pack creator. Empty = free top-100 catalog only.
      IMGFLIP_API_KEY: ${IMGFLIP_API_KEY:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    healthcheck:
      # No curl/wget in the slim image; Node 24 ships fetch.
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
